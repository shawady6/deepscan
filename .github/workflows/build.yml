name: Build exe
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p deepscan-core
      - run: cargo build --release -p deepscan
      - uses: actions/upload-artifact@v4
        with:
          name: DeepScan
          path: target/release/DeepScan.exe
