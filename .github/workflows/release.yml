name: Release
# Publishes a GitHub release automatically whenever the app version changes on main:
#   1. change "version" in core/Cargo.toml, src-tauri/Cargo.toml and src-tauri/tauri.conf.json (same number)
#   2. push to main
# If a release v<version> already exists nothing happens, so normal pushes are safe.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version and check it is consistent
        id: ver
        shell: pwsh
        run: |
          $core = (Select-String -Path core/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $app = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($core -ne $app -or $core -ne $conf) { throw "Versions differ: core=$core app=$app conf=$conf" }
          "version=$core" >> $env:GITHUB_OUTPUT
          gh release view "v$core" *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT; Write-Host "Release v$core already exists, nothing to do." } else { "exists=false" >> $env:GITHUB_OUTPUT }
          $global:LASTEXITCODE = 0
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@stable
        if: steps.ver.outputs.exists == 'false'
      - uses: Swatinem/rust-cache@v2
        if: steps.ver.outputs.exists == 'false'
      - name: Test and build
        if: steps.ver.outputs.exists == 'false'
        run: |
          cargo test -p deepscan-core
          cargo build --release -p deepscan
      - name: Checksum
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: |
          Copy-Item target/release/DeepScan.exe DeepScan.exe
          $h = (Get-FileHash DeepScan.exe -Algorithm SHA256).Hash.ToLower()
          "$h  DeepScan.exe" | Out-File -Encoding ascii DeepScan.exe.sha256
      - name: Publish release
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.ver.outputs.version }}" DeepScan.exe DeepScan.exe.sha256 --target "${{ github.sha }}" --title "DeepScan v${{ steps.ver.outputs.version }}" --generate-notes
