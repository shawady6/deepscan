name: Release
# Publish a new version:  git tag v1.1.0 && git push origin v1.1.0
# (first change "version" in core/Cargo.toml, src-tauri/Cargo.toml and src-tauri/tauri.conf.json to match)
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the app version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $core = (Select-String -Path core/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $app = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $core -or $tag -ne $app -or $tag -ne $conf) { throw "Tag $tag but versions are core=$core app=$app conf=$conf" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p deepscan-core
      - run: cargo build --release -p deepscan
      - name: Checksum
        shell: pwsh
        run: |
          Copy-Item target/release/DeepScan.exe DeepScan.exe
          $h = (Get-FileHash DeepScan.exe -Algorithm SHA256).Hash.ToLower()
          "$h  DeepScan.exe" | Out-File -Encoding ascii DeepScan.exe.sha256
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" DeepScan.exe DeepScan.exe.sha256 --title "DeepScan ${{ github.ref_name }}" --generate-notes
